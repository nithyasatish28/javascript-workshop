<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The HTML Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one reading column; a numbered lesson rail on top; each lesson runs Read → Run → What happened → Your turn */
:root {
  --bg: #f7f7f4;           /* plain workbook paper */
  --surface: #ffffff;
  --ink: #1d2433;
  --muted: #5a6273;
  --rule: #d9dbd6;
  --accent: #0f6e66;       /* tag teal */
  --accent-soft: #dcefec;
  --tag: #0f6e66;          /* syntax colours used in the anatomy diagrams */
  --attr: #8a4b08;
  --val: #6d3fa6;
  --text-part: #1d2433;
  --ok: #2b7a4b; --ok-soft: #dcefe3;
  --bad: #b3261e; --bad-soft: #f8e1df;
  --code-bg: #f0f1ee;
  --editor-bg: #1e2430; --editor-ink: #e6e9ef; --editor-gutter: #6c768a; --editor-sel: #3a4458;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Literata", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171d; --surface: #1b1f27; --ink: #e7e9ee; --muted: #a0a7b5; --rule: #2e3440;
    --accent: #5cc9bd; --accent-soft: #163a37;
    --tag: #5cc9bd; --attr: #f0b46a; --val: #c3a2f0; --text-part: #e7e9ee;
    --ok: #63c98f; --ok-soft: #173325; --bad: #ff8a80; --bad-soft: #3d1c1a;
    --code-bg: #222733;
    --editor-bg: #10141a; --editor-ink: #e6e9ef; --editor-gutter: #5e687b; --editor-sel: #2f3a4d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171d; --surface: #1b1f27; --ink: #e7e9ee; --muted: #a0a7b5; --rule: #2e3440;
  --accent: #5cc9bd; --accent-soft: #163a37;
  --tag: #5cc9bd; --attr: #f0b46a; --val: #c3a2f0; --text-part: #e7e9ee;
  --ok: #63c98f; --ok-soft: #173325; --bad: #ff8a80; --bad-soft: #3d1c1a;
  --code-bg: #222733;
  --editor-bg: #10141a; --editor-ink: #e6e9ef; --editor-gutter: #5e687b; --editor-sel: #2f3a4d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1.06rem; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 1.5rem 3.5rem;
}
.wrap { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.6rem; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.1; }
p { margin: 0; }
code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); border: 1px solid var(--rule); border-radius: 4px; padding: 0 0.3em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }

header.top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 0.8rem 1.5rem; }
.brand { display: flex; flex-direction: column; gap: 0.3rem; }
.brand h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; }
.brand h1 .lt { color: var(--accent); font-family: var(--font-mono); font-weight: 600; font-size: 0.7em; vertical-align: 0.12em; }
.brand p { color: var(--muted); max-width: 52ch; }
.progress { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress strong { color: var(--accent); font-size: 1.5rem; }

/* Lesson rail */
.rail { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0.4rem; }
@media (max-width: 700px) { .rail { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.rail button {
  width: 100%; height: 100%; text-align: left; border: 1px solid var(--rule); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 0.45rem 0.55rem; display: flex; flex-direction: column; gap: 0.1rem;
  font-family: var(--font-display); font-size: 0.82rem; line-height: 1.2; min-width: 0;
}
.rail .num { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.rail button.done .num { color: var(--ok); }
.rail button.current { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
.rail button:hover { border-color: var(--accent); }

/* Lesson */
.lesson { display: flex; flex-direction: column; gap: 1.8rem; }
.lesson-head { display: flex; flex-direction: column; gap: 0.4rem; }
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.lesson-head h2 { font-size: clamp(1.9rem, 5vw, 2.6rem); font-weight: 800; letter-spacing: -0.015em; }
.step { display: flex; flex-direction: column; gap: 0.9rem; }
.step-title { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.step-title .n { width: 1.8rem; height: 1.8rem; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--surface); font-size: 0.95rem; flex: none; }
.prose { display: flex; flex-direction: column; gap: 0.8rem; max-width: 66ch; }
.prose ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.35rem; }

/* Anatomy diagrams */
.anatomy { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 1rem; overflow-x: auto; }
.parts { display: flex; flex-wrap: wrap; align-items: flex-start; font-family: var(--font-mono); font-size: 1.05rem; }
.part { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; padding: 0 1px; }
.part .code { white-space: pre; border-bottom: 3px solid currentColor; padding-bottom: 2px; }
.part .label { font-family: var(--font-display); font-size: 0.74rem; color: var(--muted); white-space: nowrap; }
.part.tag { color: var(--tag); } .part.attr { color: var(--attr); } .part.val { color: var(--val); } .part.text { color: var(--text-part); }
.part.plain .code { border-bottom-color: transparent; }
.anatomy .caption { margin-top: 0.8rem; font-size: 0.95rem; color: var(--muted); }
.annotated { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
.annotated td { padding: 0.3rem 0.6rem; vertical-align: top; border-bottom: 1px solid var(--rule); }
.annotated tr:last-child td { border-bottom: 0; }
.annotated td:first-child { font-family: var(--font-mono); font-size: 0.86rem; color: var(--tag); white-space: pre; }
.annotated td:last-child { color: var(--muted); font-family: var(--font-display); font-size: 0.86rem; min-width: 14ch; }

/* Editor */
.editor-wrap { display: flex; flex-direction: column; gap: 0.5rem; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.filename { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); }
.btns { display: flex; gap: 0.45rem; flex-wrap: wrap; }
.btn { border: 2px solid var(--ink); background: transparent; color: var(--ink); border-radius: 8px; padding: 0.35rem 0.9rem; font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
.btn:hover { background: var(--code-bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.quiet { border-color: var(--rule); color: var(--muted); }
.editor { display: grid; grid-template-columns: auto minmax(0, 1fr); background: var(--editor-bg); color: var(--editor-ink); border-radius: 10px; overflow: hidden; font-family: var(--font-mono); font-size: 0.88rem; line-height: 1.6; }
.gutter { padding: 0.7rem 0.45rem 0.7rem 0.7rem; text-align: right; color: var(--editor-gutter); user-select: none; overflow: hidden; white-space: pre; font-variant-numeric: tabular-nums; }
.editor textarea { font: inherit; color: inherit; background: transparent; border: 0; resize: vertical; outline: none; padding: 0.7rem 0.9rem 0.7rem 0.35rem; width: 100%; min-height: 9rem; white-space: pre; overflow: auto; tab-size: 2; caret-color: var(--accent); }
.editor textarea::selection { background: var(--editor-sel); }
.editor:focus-within { box-shadow: 0 0 0 3px var(--accent); }
.tip { font-size: 0.92rem; color: var(--muted); }

/* Mini browser */
.browser { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.chrome { display: flex; align-items: flex-end; gap: 0.6rem; background: var(--code-bg); border-bottom: 1px solid var(--rule); padding: 0.45rem 0.6rem 0; }
.chrome .label { font-family: var(--font-display); font-size: 0.72rem; color: var(--muted); padding-bottom: 0.45rem; letter-spacing: 0.06em; text-transform: uppercase; }
.tab { background: var(--surface); border: 1px solid var(--rule); border-bottom: 0; border-radius: 8px 8px 0 0; padding: 0.3rem 0.8rem; font-family: var(--font-display); font-size: 0.82rem; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: -1px; }
.tab.untitled { color: var(--muted); font-style: italic; }
.viewport { min-height: 7rem; background: #ffffff; }
.status { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); background: var(--code-bg); border-top: 1px solid var(--rule); padding: 0.3rem 0.6rem; min-height: 1.9rem; overflow-wrap: anywhere; }
.status.flash { color: var(--accent); }

/* Understand */
.reveal { border-left: 4px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 0.9rem 1.1rem; display: flex; flex-direction: column; gap: 0.7rem; }
.reveal.locked { border-left-color: var(--rule); background: var(--surface); color: var(--muted); font-style: italic; }
.reveal ul { margin: 0; padding-left: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
.reveal h3 { font-size: 1rem; }

/* Fill in the blanks */
.blanks { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 0.9rem 1rem; font-family: var(--font-mono); font-size: 0.9rem; line-height: 2.1; white-space: pre; overflow-x: auto; }
.blank {
  font: inherit; font-weight: 600; color: var(--accent); background: var(--accent-soft);
  border: 0; border-bottom: 2px solid var(--accent); border-radius: 4px 4px 0 0; padding: 0 0.25rem; text-align: center; min-width: 3ch;
}
.blank:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.blank.ok { color: var(--ok); background: var(--ok-soft); border-bottom-color: var(--ok); }
.blank.bad { color: var(--bad); background: var(--bad-soft); border-bottom-color: var(--bad); }
.feedback { font-family: var(--font-display); font-weight: 600; }
.feedback.ok { color: var(--ok); } .feedback.bad { color: var(--bad); }
.feedback .detail { display: block; font-weight: 400; font-family: var(--font-body); color: var(--muted); margin-top: 0.2rem; }

.nav { display: flex; justify-content: space-between; gap: 0.6rem; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 1.2rem; }
.done-banner { display: flex; align-items: center; gap: 0.6rem; font-family: var(--font-display); font-weight: 600; color: var(--ok); }
footer { color: var(--muted); font-size: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; align-items: center; }
.confirm { display: inline-flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.sr { position: absolute; left: -10000px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="lt">&lt;/&gt;</span> The HTML Workbook</h1>
      <p>Eight short lessons. In each one, read a little, run an example, see what happened, then fill in the blanks yourself.</p>
    </div>
    <p class="progress" aria-live="polite"><strong id="done-count">0</strong> of <span id="total-count">8</span> lessons done</p>
  </header>

  <nav aria-label="Lessons"><ol class="rail" id="rail"></ol></nav>

  <main class="lesson" id="lesson"></main>

  <footer>
    <span>Your progress is saved in this browser.</span>
    <span class="confirm" id="reset-area"><button class="btn quiet" id="btn-reset-all" type="button">Start over</button></span>
  </footer>
</div>

<script>
(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---------- Built-in pictures for the image lessons ---------- */
  const IMAGES = {
    "mountains.svg": '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180"><rect width="300" height="180" fill="#bfe3f7"/><circle cx="235" cy="45" r="22" fill="#ffd34d"/><polygon points="0,180 90,70 170,180" fill="#4f9d69"/><polygon points="100,180 200,55 300,180" fill="#2f7d4f"/><polygon points="182,78 200,55 218,78 208,74 200,82 192,74" fill="#ffffff"/><rect y="160" width="300" height="20" fill="#3d8b57"/><\/svg>',
    "avatar.svg": '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="60" fill="#e8eef9"/><circle cx="60" cy="62" r="40" fill="#ffcf6b"/><circle cx="46" cy="55" r="5" fill="#2b2b2b"/><circle cx="74" cy="55" r="5" fill="#2b2b2b"/><path d="M42 72 Q60 90 78 72" stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round"/><\/svg>'
  };
  const imageUrl = (name) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(IMAGES[name]);

  /* ---------- The lessons ---------- */
  const LESSONS = [
    {
      title: "Tags and elements", short: "Tags",
      read: `
        <p>HTML tells the browser what each part of a page <em>is<\/em>: a heading, a paragraph, a list. You do that by wrapping text in <strong>tags<\/strong>.<\/p>
        <p>Most tags come in pairs. The opening tag starts the part, and the closing tag, with a slash, ends it. Together with the text inside, they make an <strong>element<\/strong>.<\/p>`,
      anatomy: { parts: [["<p>", "opening tag", "tag"], ["This is a paragraph.", "content", "text"], ["<\/p>", "closing tag", "tag"]], caption: "The whole thing, from <p> to <\/p>, is one paragraph element. The browser shows the content, not the tags." },
      file: "index.html",
      code:
`<h1>My first web page<\/h1>
<p>This is a paragraph. The browser shows it as normal text.<\/p>
<p>This is another paragraph. Each one starts on a new line.<\/p>`,
      runTip: "Press Run. Then try changing the heading text and run it again.",
      happened: [
        "<code>&lt;h1&gt;<\/code> became a big, bold heading. <code>h1<\/code> means heading level 1: the main title of the page.",
        "Each <code>&lt;p&gt;<\/code> became its own block of text, with space above and below.",
        "The tags themselves did not appear. The browser read them as instructions and showed only the text inside."
      ],
      tryMore: "Delete the <code>&lt;/h1&gt;<\/code> closing tag and run it again. Without it, the browser doesn't know where the heading ends, so the paragraphs get swept into it.",
      blanks:
`<[[h1]]>All about cats<\/h1>
<[[p]]>Cats sleep for about 15 hours a day.<\/p>
<p>They have five toes on each front paw.<[[/p]]>`
    },
    {
      title: "Headings and text", short: "Headings",
      read: `
        <p>HTML has six heading levels, <code>&lt;h1&gt;<\/code> to <code>&lt;h6&gt;<\/code>. Use them like a book: <code>h1<\/code> is the page title, <code>h2<\/code> starts a section, <code>h3<\/code> a smaller part inside it. A page usually has one <code>h1<\/code>.<\/p>
        <p>Inside a line of text, <code>&lt;strong&gt;<\/code> marks something important, and <code>&lt;em&gt;<\/code> adds emphasis, the way your voice would stress a word.<\/p>`,
      file: "index.html",
      code:
`<h1>Healthy Habits<\/h1>

<h2>Sleep<\/h2>
<p>Most adults need <strong>7 to 9 hours<\/strong> of sleep.<\/p>

<h2>Water<\/h2>
<p>Drink water <em>before<\/em> you feel thirsty.<\/p>

<h3>Tip<\/h3>
<p>Carry a bottle with you.<\/p>`,
      runTip: "Run it and compare the sizes of the three heading levels.",
      happened: [
        "<code>h1<\/code>, <code>h2<\/code> and <code>h3<\/code> got smaller step by step. The level shows how important the heading is, not just its size.",
        "<code>&lt;strong&gt;<\/code> made “7 to 9 hours” bold, and <code>&lt;em&gt;<\/code> made “before” italic.",
        "Headings and paragraphs each started a new line. These are <strong>block<\/strong> elements.",
        "<code>strong<\/code> and <code>em<\/code> stayed inside their sentence. These are <strong>inline<\/strong> elements."
      ],
      tryMore: "Change <code>&lt;h3&gt;Tip&lt;/h3&gt;<\/code> to <code>&lt;h2&gt;Tip&lt;/h2&gt;<\/code>. The Tip becomes a section of its own, at the same level as Sleep and Water.",
      blanks:
`<h1>My Weekend<\/h1>
<[[h2]]>Saturday<\/h2>
<p>I visited the <[[strong]]>science museum<\/strong>.<\/p>
<h2>Sunday<\/[[h2]]>
<p>I read a book, and it was <[[em]]>really<\/em> good.<\/p>`
    },
    {
      title: "Lists", short: "Lists",
      read: `
        <p>Lists come in two kinds. <code>&lt;ul&gt;<\/code> is an <strong>unordered list<\/strong>, shown with bullets, for items in no particular order. <code>&lt;ol&gt;<\/code> is an <strong>ordered list<\/strong>, numbered, for steps that happen in order.<\/p>
        <p>Each item goes in its own <code>&lt;li&gt;<\/code>, which stands for list item. The <code>&lt;li&gt;<\/code> elements sit inside the <code>&lt;ul&gt;<\/code> or <code>&lt;ol&gt;<\/code>. The indenting is only there to make the code easier for people to read.<\/p>`,
      file: "index.html",
      code:
`<h2>Shopping list<\/h2>
<ul>
  <li>Bread<\/li>
  <li>Milk<\/li>
  <li>Apples<\/li>
<\/ul>

<h2>How to make tea<\/h2>
<ol>
  <li>Boil water<\/li>
  <li>Add the tea bag<\/li>
  <li>Wait 3 minutes<\/li>
<\/ol>`,
      runTip: "Run it, then move “Wait 3 minutes” to the top of the tea steps and run it again.",
      happened: [
        "The <code>&lt;ul&gt;<\/code> list got bullets. The <code>&lt;ol&gt;<\/code> list got numbers.",
        "Nobody typed the numbers 1, 2, 3. The browser counts the <code>&lt;li&gt;<\/code> items itself, so if you move a step, the numbers still come out in order.",
        "Each <code>&lt;li&gt;<\/code> started on its own line, indented under the heading."
      ],
      tryMore: "Change <code>&lt;ol&gt;<\/code> and <code>&lt;/ol&gt;<\/code> to <code>&lt;ul&gt;<\/code> and <code>&lt;/ul&gt;<\/code>. The steps keep their order but lose their numbers.",
      blanks:
`<h2>My top 3 films<\/h2>
<[[ol]]>
  <li>Inception<\/li>
  <[[li]]>Interstellar<\/li>
  <li>Up<\/[[li]]>
<\/ol>`
    },
    {
      title: "Links and attributes", short: "Links",
      read: `
        <p>A link uses the <code>&lt;a&gt;<\/code> tag, short for anchor. The text between the tags is what people click. But where does the link go?<\/p>
        <p>That's set with an <strong>attribute<\/strong>: extra information written inside the opening tag, as <code>name="value"<\/code>. For links, the attribute is <code>href<\/code>, the address to go to.<\/p>`,
      anatomy: { parts: [["<a ", "tag", "tag"], ["href", "attribute", "attr"], ['="https://www.wikipedia.org"', "its value", "val"], [">", "", "tag plain"], ["Wikipedia", "link text", "text"], ["<\/a>", "closing tag", "tag"]], caption: "Attributes always go in the opening tag, never the closing one." },
      file: "index.html",
      code:
`<p>Learn more on <a href="https://developer.mozilla.org">MDN Web Docs<\/a>.<\/p>
<p>Or search on <a href="https://www.google.com" target="_blank">Google<\/a> in a new tab.<\/p>`,
      runTip: "Run it, then hover over each link and watch the grey bar at the bottom of the preview.",
      happened: [
        "Only the link text showed, blue and underlined. The <code>href<\/code> address stayed hidden.",
        "Hovering showed the address in the bar at the bottom, just like a real browser does.",
        "The second link has another attribute, <code>target=\"_blank\"<\/code>, which tells the browser to open it in a new tab. An element can have several attributes, separated by spaces."
      ],
      tryMore: "Links don't open from this practice preview. Clicking one shows where it would have gone.",
      blanks:
`<p>My favourite site is <a [[href]]="https://www.wikipedia.org">Wikipedia<\/[[a]]>.<\/p>
<p>Space news is on <[[a]] href="https://www.nasa.gov">NASA<\/a>.<\/p>`
    },
    {
      title: "Images", short: "Images",
      read: `
        <p>The <code>&lt;img&gt;<\/code> tag shows a picture. It needs two attributes: <code>src<\/code>, the image file to show, and <code>alt<\/code>, a short description of the picture.<\/p>
        <p>The <code>alt<\/code> text is read aloud by screen readers for people who can't see the image, and it appears if the image fails to load.<\/p>
        <p><code>&lt;img&gt;<\/code> has no closing tag, because there's no text to wrap. It's an <strong>empty element<\/strong>.<\/p>`,
      anatomy: { parts: [["<img ", "tag", "tag"], ["src", "which file", "attr"], ['="mountains.svg" ', "", "val"], ["alt", "description", "attr"], ['="Green hills"', "", "val"], [">", "no closing tag", "tag"]], caption: "In this workbook, mountains.svg and avatar.svg are built in, so you can use them anywhere." },
      file: "index.html",
      code:

  LESSONS.forEach((l, i) => { l.id = i + 1; });
  const TOTAL = LESSONS.length;
  $("total-count").textContent = TOTAL;

  /* ---------- Saved progress (this browser only) ---------- */
  const STORE = "html-workbook-v1";
  function load() { try { return JSON.parse(localStorage.getItem(STORE)) || null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }
  const state = Object.assign({ current: 1, done: [], ran: [], code: {} }, load() || {});
  const isDone = (id) => state.done.includes(id);

  /* ---------- Mini browser preview ---------- */
  function makeBrowser(label) {
    const box = document.createElement("div");
    box.className = "browser";
    box.innerHTML = '<div class="chrome"><span class="tab untitled">index.html<\/span><span class="label">' + esc(label) + '<\/span><\/div><div class="viewport"><\/div><div class="status" aria-live="polite"><\/div>';
    const tab = box.querySelector(".tab"), viewport = box.querySelector(".viewport"), status = box.querySelector(".status");
    const shadow = viewport.attachShadow({ mode: "open" });
    let flashTimer = null;
    const setStatus = (text, flash) => {
      status.textContent = text || "";
      status.classList.toggle("flash", !!flash);
      clearTimeout(flashTimer);
      if (flash) flashTimer = setTimeout(() => status.classList.remove("flash"), 1500);
    };
    shadow.addEventListener("mouseover", (e) => { const a = e.target.closest && e.target.closest("a[href]"); setStatus(a ? a.getAttribute("href") : ""); });
    shadow.addEventListener("click", (e) => {
      const a = e.target.closest && e.target.closest("a[href]");
      if (a) { e.preventDefault(); setStatus("This link would open: " + a.getAttribute("href") + (a.getAttribute("target") === "_blank" ? " (in a new tab)" : ""), true); }
    });
    shadow.addEventListener("submit", (e) => {
      e.preventDefault();
      const data = new FormData(e.target);
      const pairs = Array.from(data.entries()).map(([k, v]) => k + "=" + (v === "" ? "(empty)" : v));
      setStatus("Form sent: " + (pairs.length ? pairs.join(", ") : "nothing, because no input has a name"), true);
    });
    function render(source) {
      const doc = new DOMParser().parseFromString(source, "text/html");
      doc.querySelectorAll("script, link, iframe, object, embed, base, meta").forEach((n) => n.remove());
      doc.querySelectorAll("*").forEach((el) => { for (const at of Array.from(el.attributes)) if (/^on/i.test(at.name)) el.removeAttribute(at.name); });
      const title = (doc.title || "").trim();
      tab.textContent = title || "index.html";
      tab.classList.toggle("untitled", !title);
      const styles = Array.from(doc.querySelectorAll("style")).map((s) => s.outerHTML).join("");
      shadow.innerHTML =
        "<style>:host{display:block;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4;color:#111;background:#fff;padding:12px 14px;}" +
        "img{max-width:100%;} a{color:#0b57d0;} input,button{font:inherit;margin:2px 4px 2px 0;} :host *:first-child{margin-top:0;}<\/style>" +
        styles + doc.body.innerHTML;
      shadow.querySelectorAll("img[src]").forEach((img) => {
        const name = (img.getAttribute("src") || "").split("/").pop();
        if (IMAGES[name]) img.src = imageUrl(name);
      });
      setStatus("");
    }
    return { el: box, render };
  }

  /* ---------- Editor ---------- */
  function makeEditor(initial, filename, onRun, onReset) {
    const wrap = document.createElement("div");
    wrap.className = "editor-wrap";
    wrap.innerHTML =
      '<div class="toolbar"><span class="filename">' + esc(filename) + '<\/span><div class="btns">' +
      '<button class="btn quiet" type="button" data-act="reset">Reset<\/button>' +
      '<button class="btn primary" type="button" data-act="run">Run ▸<\/button><\/div><\/div>' +
      '<div class="editor"><div class="gutter" aria-hidden="true"><\/div><textarea spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Example code you can edit"><\/textarea><\/div>';
    const ta = wrap.querySelector("textarea"), gutter = wrap.querySelector(".gutter");
    ta.value = initial;
    const lines = () => { const n = ta.value.split("\n").length; let s = ""; for (let i = 1; i <= n; i++) s += i + "\n"; gutter.textContent = s; ta.rows = Math.min(Math.max(n + 1, 5), 22); gutter.scrollTop = ta.scrollTop; };
    lines();
    let escFlag = false;
    const insert = (text) => {
      ta.focus();
      if (!document.execCommand || !document.execCommand("insertText", false, text)) ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, "end");
      lines();
    };
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { escFlag = true; return; }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); onRun(ta.value); return; }
      if (e.key === "Tab" && !e.shiftKey && !escFlag) { e.preventDefault(); insert("  "); return; }
      if (e.key === "Enter") {
        const before = ta.value.slice(0, ta.selectionStart);
        const line = before.slice(before.lastIndexOf("\n") + 1);
        e.preventDefault(); insert("\n" + (line.match(/^\s*/) || [""])[0]); return;
      }
      escFlag = false;
    });
    ta.addEventListener("input", lines);
    ta.addEventListener("scroll", () => { gutter.scrollTop = ta.scrollTop; });
    ta.addEventListener("blur", () => { escFlag = false; });
    wrap.querySelector('[data-act="run"]').addEventListener("click", () => onRun(ta.value));
    wrap.querySelector('[data-act="reset"]').addEventListener("click", () => { ta.value = onReset(); lines(); onRun(ta.value); });
    return { el: wrap, get value() { return ta.value; } };
  }

  /* ---------- Fill in the blanks ---------- */
  function parseBlanks(template) {
    const pieces = [];
    const re = /\[\[(.+?)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(template))) {
      pieces.push({ text: template.slice(last, m.index) });
      pieces.push({ answers: m[1].split("|") });
      last = re.lastIndex;
    }
    pieces.push({ text: template.slice(last) });
    return pieces;
  }
  const normalize = (s) => String(s || "").trim().toLowerCase().replace(/^<+|>+$/g, "").trim();

  function makeBlanks(lesson, onSolved) {
    const box = document.createElement("div");
    box.className = "step-body";
    const pieces = parseBlanks(lesson.blanks);
    const code = document.createElement("div");
    code.className = "blanks";
    const inputs = [];
    let n = 0;
    for (const p of pieces) {
      if (p.text !== undefined) { code.appendChild(document.createTextNode(p.text)); continue; }
      n++;
      const inp = document.createElement("input");
      inp.type = "text"; inp.className = "blank";
      inp.setAttribute("aria-label", "Blank " + n);
      inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("autocapitalize", "off");
      const w = Math.max(...p.answers.map((a) => a.length), 2) + 1.5;
      inp.style.width = w + "ch";
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); check(); } });
      inp.addEventListener("input", () => inp.classList.remove("ok", "bad"));
      inp._answers = p.answers;
      inputs.push(inp);
      code.appendChild(inp);
    }
    const bar = document.createElement("div");
    bar.className = "toolbar";
    bar.innerHTML = '<span class="filename">Fill each box, then check.<\/span><div class="btns"><button class="btn quiet" type="button" data-act="show" hidden>Show answers<\/button><button class="btn primary" type="button" data-act="check">Check<\/button><\/div>';
    const feedback = document.createElement("p");
    feedback.className = "feedback"; feedback.setAttribute("aria-live", "polite");
    const result = makeBrowser("Your result");
    result.el.hidden = true;
    box.append(code, bar, feedback, result.el);
    let tries = 0;
    const filled = (useAnswers) => pieces.map((p, i) => p.text !== undefined ? p.text : (useAnswers ? p.answers[0] : inputs[pieces.slice(0, i).filter((q) => q.answers).length].value.trim())).join("");
    function check() {
      let right = 0, empty = 0;
      inputs.forEach((inp) => {
        if (!inp.value.trim()) { empty++; inp.classList.remove("ok"); inp.classList.add("bad"); return; }
        const ok = inp._answers.some((a) => normalize(a) === normalize(inp.value));
        inp.classList.toggle("ok", ok); inp.classList.toggle("bad", !ok);
        if (ok) right++;
      });
      if (right === inputs.length) {
        feedback.className = "feedback ok";
        feedback.innerHTML = "All correct! <span class=\"detail\">Here's what your finished code shows in a browser.<\/span>";
        result.el.hidden = false; result.render(filled(true));
        onSolved();
      } else {
        tries++;
        feedback.className = "feedback bad";
        const wrong = inputs.length - right - empty;
        feedback.innerHTML = right + " of " + inputs.length + " correct." +
          '<span class="detail">' + (empty ? empty + " still empty. " : "") + (wrong ? "The red boxes need another look. Compare with the example above." : "") + "<\/span>";
        if (tries >= 2) bar.querySelector('[data-act="show"]').hidden = false;
      }
    }
    bar.querySelector('[data-act="check"]').addEventListener("click", check);
    bar.querySelector('[data-act="show"]').addEventListener("click", () => {
      inputs.forEach((inp) => { inp.value = inp._answers[0]; inp.classList.remove("bad"); });
      feedback.className = "feedback";
      feedback.innerHTML = "Answers filled in. Read through them, then press Check.";
    });
    if (isDone(lesson.id)) { inputs.forEach((inp) => { inp.value = inp._answers[0]; inp.classList.add("ok"); }); }
    return box;
  }

  /* ---------- Anatomy diagrams ---------- */
  function anatomyEl(l) {
    if (l.anatomy) {
      const d = document.createElement("div");
      d.className = "anatomy";
      d.innerHTML = '<div class="parts">' + l.anatomy.parts.map(([code, label, kind]) =>
        '<span class="part ' + kind + '"><span class="code">' + esc(code) + '<\/span><span class="label">' + esc(label || " ") + "<\/span><\/span>").join("") + "<\/div>" +
        '<p class="caption">' + esc(l.anatomy.caption) + "<\/p>";
      return d;
    }
    if (l.annotated) {
      const d = document.createElement("div");
      d.className = "anatomy";
      d.innerHTML = '<table class="annotated"><tbody>' + l.annotated.map(([c, note]) => "<tr><td>" + esc(c) + "<\/td><td>" + esc(note) + "<\/td><\/tr>").join("") + "<\/tbody><\/table>";
      return d;
    }
    return null;
  }

  /* ---------- Rendering a lesson ---------- */
  function step(n, title) {
    const s = document.createElement("section");
    s.className = "step";
    s.innerHTML = '<h3 class="step-title"><span class="n" aria-hidden="true">' + n + "<\/span>" + esc(title) + "<\/h3>";
    return s;
  }

  function renderRail() {
    const rail = $("rail");
    rail.innerHTML = "";
    LESSONS.forEach((l) => {
      const li = document.createElement("li");
      const b = document.createElement("button");
      b.type = "button";
      b.className = (isDone(l.id) ? "done " : "") + (state.current === l.id ? "current" : "");
      if (state.current === l.id) b.setAttribute("aria-current", "step");
      b.innerHTML = '<span class="num">' + (isDone(l.id) ? "✓ " : "") + String(l.id).padStart(2, "0") + "<\/span>" + esc(l.short);
      b.setAttribute("aria-label", "Lesson " + l.id + ": " + l.title + (isDone(l.id) ? ", done" : ""));
      b.addEventListener("click", () => goTo(l.id));
      li.appendChild(b); rail.appendChild(li);
    });
    $("done-count").textContent = state.done.length;
  }

  function renderLesson() {
    const l = LESSONS[state.current - 1];
    const main = $("lesson");
    main.innerHTML = "";

    const head = document.createElement("div");
    head.className = "lesson-head";
    head.innerHTML = '<span class="eyebrow">Lesson ' + l.id + " of " + TOTAL + "<\/span><h2>" + esc(l.title) + "<\/h2>";
    main.appendChild(head);

    // 1. Read
    const s1 = step(1, "Read");
    const prose = document.createElement("div"); prose.className = "prose"; prose.innerHTML = l.read;
    s1.appendChild(prose);
    const an = anatomyEl(l); if (an) s1.appendChild(an);
    main.appendChild(s1);

    // 2. Run it
    const s2 = step(2, "Run it");
    const tip = document.createElement("p"); tip.className = "tip"; tip.textContent = l.runTip;
    const browser = makeBrowser("Preview");
    const s3 = step(3, "What happened");
    const reveal = document.createElement("div");
    const showReveal = () => {
      reveal.className = "reveal";
      reveal.innerHTML = "<ul>" + l.happened.map((x) => "<li>" + x + "<\/li>").join("") + "<\/ul>" +
        (l.tryMore ? "<h3>Try this<\/h3><p>" + l.tryMore + "<\/p>" : "");
    };
    const editor = makeEditor(state.code[l.id] != null ? state.code[l.id] : l.code, l.file,
      (src) => {
        browser.render(src);
        state.code[l.id] = src;
        if (!state.ran.includes(l.id)) state.ran.push(l.id);
        save(); showReveal();
      },
      () => { delete state.code[l.id]; save(); return l.code; });
    s2.append(tip, editor.el, browser.el);
    main.appendChild(s2);

    // 3. What happened
    if (state.ran.includes(l.id)) { showReveal(); browser.render(editor.value); }
    else { reveal.className = "reveal locked"; reveal.textContent = "Run the code above first. Then the explanation appears here."; }
    s3.appendChild(reveal);
    main.appendChild(s3);

    // 4. Your turn
    const s4 = step(4, "Your turn");
    const intro = document.createElement("p"); intro.className = "prose";
    intro.textContent = "Fill in the missing parts. Type only what goes in each box.";
    s4.append(intro, makeBlanks(l, () => {
      if (!isDone(l.id)) { state.done.push(l.id); save(); renderRail(); renderNav(); }
    }));
    main.appendChild(s4);

    const nav = document.createElement("div"); nav.className = "nav"; nav.id = "lesson-nav";
    main.appendChild(nav);
    renderNav();
  }

  function renderNav() {
    const l = LESSONS[state.current - 1];
    const nav = $("lesson-nav"); if (!nav) return;
    nav.innerHTML = "";
    const prev = LESSONS[l.id - 2], next = LESSONS[l.id];
    const left = document.createElement("div");
    if (prev) { const b = document.createElement("button"); b.type = "button"; b.className = "btn quiet"; b.textContent = "← " + prev.title; b.addEventListener("click", () => goTo(prev.id)); left.appendChild(b); }
    const right = document.createElement("div");
    right.style.display = "flex"; right.style.gap = "0.8rem"; right.style.alignItems = "center"; right.style.flexWrap = "wrap";
    if (isDone(l.id)) { const d = document.createElement("span"); d.className = "done-banner"; d.textContent = "✓ Lesson done"; right.appendChild(d); }
    if (next) { const b = document.createElement("button"); b.type = "button"; b.className = "btn" + (isDone(l.id) ? " primary" : ""); b.textContent = next.title + " →"; b.addEventListener("click", () => goTo(next.id)); right.appendChild(b); }
    else if (state.done.length === TOTAL) { const d = document.createElement("span"); d.className = "done-banner"; d.textContent = "You finished every lesson."; right.appendChild(d); }
    nav.append(left, right);
  }

  function goTo(id) {
    state.current = id; save();
    renderRail(); renderLesson();
    $("lesson").scrollIntoView({ block: "start" });
  }

  /* ---------- Start over ---------- */
  function showResetButton() {
    $("reset-area").innerHTML = '<button class="btn quiet" id="btn-reset-all" type="button">Start over<\/button>';
    $("btn-reset-all").addEventListener("click", askReset);
  }
  function askReset() {
    $("reset-area").innerHTML = '<span>Clear all progress and edits?<\/span><button class="btn" id="yes-reset" type="button">Yes, start over<\/button><button class="btn quiet" id="no-reset" type="button">Cancel<\/button>';
    $("yes-reset").addEventListener("click", () => { state.current = 1; state.done = []; state.ran = []; state.code = {}; save(); showResetButton(); renderRail(); renderLesson(); });
    $("no-reset").addEventListener("click", showResetButton);
  }
  $("btn-reset-all").addEventListener("click", askReset);

  if (!(state.current >= 1 && state.current <= TOTAL)) state.current = 1;
  window.__workbook = { LESSONS, state, goTo };
  renderRail(); renderLesson();
})();
</script>
